name: Tasks

on: [push, pull_request]

jobs:
  lint-php:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}${{ matrix.composer_flags && ' (lowest)' || '' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            typo3: '13'
          - php: '8.3'
            typo3: '13'
          - php: '8.4'
            typo3: '13'
          - php: '8.5'
            typo3: '13'
          - php: '8.2'
            typo3: '13'
            composer_flags: '--prefer-lowest --prefer-stable'
          - php: '8.5'
            typo3: '13'
            composer_flags: '--prefer-lowest --prefer-stable'
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v2
      - uses: actions/cache@v3
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php }}-composer-
      - run: composer require typo3/minimal="^${{ matrix.typo3 }}.4" --dev --no-update --no-interaction
      - run: composer update --with-all-dependencies --no-interaction --no-progress ${{ matrix.composer_flags }}
      - run: ./vendor/bin/grumphp run --ansi
