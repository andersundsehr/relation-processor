name: Tasks

on: [push, pull_request]

jobs:
  lint-php:
    name: "PHP ${{ matrix.php }} / TYPO3 13"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          ini-values: apc.enable_cli=1, memory_limit=1G
      - run: composer require "typo3/minimal:^13.4" --dev --no-interaction -W
      - run: vendor/bin/grumphp run --ansi

  lowest-dependencies:
    name: "Lowest dependencies / PHP ${{ matrix.php }} / TYPO3 13"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          ini-values: apc.enable_cli=1, memory_limit=1G
      - run: composer require "typo3/minimal:^13.4" --dev --no-update --no-interaction
      - run: composer update --prefer-lowest --prefer-stable --no-interaction -W
      - run: vendor/bin/grumphp run --ansi
